<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f5d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Libreta">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Libreta de Campo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}
/* Layout: app de una columna para el celular, encabezado fijo arriba, barra de pestañas abajo, hojas que suben desde abajo para cargar datos */
:root{
  --bg:#eef1ea; --surface:#fbfcf8; --surface-2:#e4e9de; --ink:#1b2419; --muted:#5d6a59; --line:#d3dacb;
  --accent:#2f5d3a; --accent-ink:#ffffff; --accent-soft:#dbe8d9;
  --ochre:#9a600c; --ochre-soft:#f5e6c9; --danger:#b3261e; --danger-soft:#f6dcd9; --ok:#2e7d4f; --ok-soft:#d8eedf;
  --rain:#2d6a8f; --rain-soft:#d6e6f0;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121611; --surface:#1b2119; --surface-2:#242c22; --ink:#e6ebe1; --muted:#9aa695; --line:#2f392c;
  --accent:#86bd91; --accent-ink:#0f1a10; --accent-soft:#25362a;
  --ochre:#e4ab50; --ochre-soft:#3a2f1b; --danger:#f08a80; --danger-soft:#3d2120; --ok:#7cc79a; --ok-soft:#1f3326;
  --rain:#82b8da; --rain-soft:#1c2e3a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121611; --surface:#1b2119; --surface-2:#242c22; --ink:#e6ebe1; --muted:#9aa695; --line:#2f392c;
  --accent:#86bd91; --accent-ink:#0f1a10; --accent-soft:#25362a;
  --ochre:#e4ab50; --ochre-soft:#3a2f1b; --danger:#f08a80; --danger-soft:#3d2120; --ok:#7cc79a; --ok-soft:#1f3326;
  --rain:#82b8da; --rain-soft:#1c2e3a; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px}

/* Encabezado */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:1.45rem;letter-spacing:.01em;margin:0;line-height:1.1}
.brand small{color:var(--muted);font-size:.82rem}
.sync{font-size:.75rem;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.nube::before{background:var(--ok)} .sync.local::before{background:var(--ochre)} .sync.error::before{background:var(--danger)}

main{padding-block:16px 120px}
.view{display:flex;flex-direction:column;gap:20px}
.view[hidden]{display:none!important}

h2.sec{font-family:var(--f-display);font-weight:600;font-size:.95rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.sec-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-row .link{background:none;border:0;color:var(--accent);font-weight:600;font-size:.9rem;padding:4px 0;cursor:pointer}

/* Cifras del resumen */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px}
.stat b{display:block;font-family:var(--f-display);font-size:1.75rem;font-weight:700;line-height:1}
.stat span{display:block;color:var(--muted);font-size:.78rem;margin-top:6px}
.stat.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stat.accent span{color:inherit;opacity:.8}

.banner{background:var(--ochre-soft);color:var(--ink);border-radius:var(--r);padding:10px 12px;font-size:.88rem}

/* Listas y tarjetas */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card-title{font-family:var(--f-display);font-weight:700;font-size:1.25rem;line-height:1.15;margin:0;min-width:0;overflow-wrap:anywhere}
.card-sub{color:var(--muted);font-size:.85rem}
.big{text-align:right;flex-shrink:0}
.big b{font-family:var(--f-display);font-size:1.9rem;line-height:1;display:block}
.big span{font-size:.75rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8rem;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.mid{background:var(--ochre-soft);color:var(--ochre)} .chip.high{background:var(--danger-soft);color:var(--danger)}
.chip.rain{background:var(--rain-soft);color:var(--rain)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;color:var(--muted)}
.meta .warn{color:var(--ochre);font-weight:600}
.notes{font-size:.9rem;color:var(--muted);margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:.9rem;cursor:pointer;min-height:40px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.fab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Filas simples (sanidad, lluvias, alertas) */
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:flex-start}
.row:first-child{border-top:0}
.row .date{flex-shrink:0;width:46px;text-align:center;font-family:var(--f-display);line-height:1}
.row .date b{display:block;font-size:1.4rem}
.row .date span{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.row .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.row .body strong{font-weight:600;overflow-wrap:anywhere}
.row .tools{display:flex;gap:6px;flex-shrink:0}
.icon-btn{border:1px solid var(--line);background:transparent;border-radius:8px;min-width:40px;height:36px;padding:0 8px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--muted)}
.icon-btn.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.month-head{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 8px}
.month-head h3{font-family:var(--f-display);font-size:1.15rem;margin:0;text-transform:capitalize}
.month-head span{font-size:.85rem;color:var(--muted)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line)}
.alert:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex-shrink:0;background:var(--ochre)}
.dot.red{background:var(--danger)} .dot.blue{background:var(--rain)} .dot.green{background:var(--ok)}

.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cats div{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.95rem}
.cats div b{font-family:var(--f-display);font-size:1.15rem}

.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 12px}

.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select,.filters input{flex:1;min-width:130px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:16px}

.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px 6px}
.chart svg{display:block;width:100%;height:auto}

/* Barra de pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);padding-inline:4px}
.tab{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:.78rem;font-weight:600;cursor:pointer}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:31;background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;height:54px;padding:0 20px;font-weight:600;font-size:1rem;box-shadow:0 6px 18px rgba(20,40,20,.25);cursor:pointer;display:flex;align-items:center;gap:8px}
.fab span{font-size:1.5rem;line-height:1;margin-top:-2px}

/* Hoja de carga */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-backdrop{position:absolute;inset:0;background:rgba(10,15,10,.45)}
.sheet-panel{position:relative;width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:6px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet-panel{animation:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--surface);padding:10px 0;z-index:1}
.sheet-head h2{font-family:var(--f-display);font-size:1.35rem;margin:0}
form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lbl{font-size:.82rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;width:100%}
.field textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.catgrid .field input{padding:9px 10px}
.hint{font-size:.82rem;color:var(--muted);margin:0}
.form-actions{display:flex;gap:10px;margin-top:4px}
.form-actions .btn{flex:1;min-height:48px;font-size:1rem}
.err{color:var(--danger);font-size:.88rem;margin:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;font-weight:500;max-width:calc(100% - 32px)}
.foot{color:var(--muted);font-size:.78rem;text-align:center}
@media (min-width:900px){.wrap{max-width:920px}#v-potreros .list{display:grid;grid-template-columns:1fr 1fr;align-items:start}.fab{right:max(16px,calc(50% - 444px))}}
.acct{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.acct svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.gate{min-height:80vh;display:flex;align-items:center;justify-content:center;padding-block:40px}
.gate-box{max-width:420px;width:100%;display:flex;flex-direction:column;gap:16px;text-align:center}
.gate-box h2{font-family:var(--f-display);font-size:2rem;margin:0}
.gate-box p{color:var(--muted);margin:0}
.gate-box .btn{min-height:52px;font-size:1.05rem}
.stack{display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand"><h1>Libreta de Campo</h1><small id="hoy"></small></div>
    <div style="display:flex;gap:8px;align-items:center"><div id="sync" class="sync" hidden>Conectando…</div><button id="acctBtn" class="acct" type="button" data-act="account" aria-label="Cuenta y copias" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button></div>
  </div>
</header>

<div id="gate" class="wrap gate"><div class="gate-box" id="gateBox"><p>Cargando…</p></div></div>
<main class="wrap" id="app" hidden>
  <section id="v-inicio" class="view" aria-label="Resumen"></section>
  <section id="v-potreros" class="view" aria-label="Potreros" hidden></section>
  <section id="v-sanidad" class="view" aria-label="Sanidad" hidden></section>
  <section id="v-lluvias" class="view" aria-label="Lluvias" hidden></section>
</main>

<button id="fab" hidden class="fab" type="button" data-act="fab"><span>+</span><em id="fabLbl" style="font-style:normal">Potrero</em></button>

<nav id="tabs" hidden class="tabs" aria-label="Secciones">
  <div class="wrap">
    <button class="tab" type="button" data-act="nav" data-v="inicio" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>Resumen</button>
    <button class="tab" type="button" data-act="nav" data-v="potreros"><svg viewBox="0 0 24 24"><path d="M3 19h18"/><path d="M5 19V9M19 19V9"/><path d="M5 11h14M5 15h14"/></svg>Potreros</button>
    <button class="tab" type="button" data-act="nav" data-v="sanidad"><svg viewBox="0 0 24 24"><path d="M15 3l6 6"/><path d="M18 6L8 16l-3-3L15 3"/><path d="M8 16l-4 4"/><path d="M11 9l3 3"/></svg>Sanidad</button>
    <button class="tab" type="button" data-act="nav" data-v="lluvias"><svg viewBox="0 0 24 24"><path d="M12 3c3 4.5 6 8 6 11a6 6 0 0 1-12 0c0-3 3-6.5 6-11z"/></svg>Lluvias</button>
  </div>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-act="close"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button type="button" class="btn ghost" data-act="close">Cerrar</button></div>
    <form id="sheetForm" novalidate></form>
  </div>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
<script type="module">
import { FB_CONFIG } from './firebase-config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
/* ---------- Datos fijos ---------- */
// [clave, nombre, equivalente UG aproximado]
const CATS=[['vacas','Vacas',1],['vaquillonas','Vaquillonas',0.7],['novillos','Novillos',0.8],['terneros','Terneros',0.4],['toros','Toros',1.2],['ovinos','Ovinos',0.17],['equinos','Equinos',1.2]];
const TIPOS=['Vacuna','Antiparasitario interno','Garrapaticida / baño','Antibiótico','Vitaminas / minerales','Otro'];
const PASTO=['Bueno','Regular','Escaso'];
const AGUA=['Tajamar','Bebedero','Arroyo / cañada','Sin agua'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const COLS=['potreros','sanidad','lluvias','movimientos','historial'];
const state={potreros:[],sanidad:[],lluvias:[],movimientos:[],historial:[]};
let backend=null, view='inicio', sheetSubmit=null, sheetRefresh=null;
const ui={sanYear:'todos',sanQ:'',histMes:'',campoMes:''};

/* ---------- Utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseD(s){const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1);}
function days(a,b){return Math.round((parseD(b)-parseD(a))/86400000);}
function fmtD(s){if(!s)return '';const d=parseD(s);const y=d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'';return d.getDate()+' '+MESES[d.getMonth()].slice(0,3)+y;}
function fullD(s){if(!s)return '';const d=parseD(s);return d.getDate()+' '+MESES[d.getMonth()].slice(0,3)+' '+d.getFullYear();}
function hace(s){if(!s)return 'sin fecha';const n=days(s,todayStr());return n<=0?'hoy':n===1?'ayer':'hace '+n+' días';}
function nf(n,dec=0){return Number(n||0).toLocaleString('es-UY',{minimumFractionDigits:dec,maximumFractionDigits:dec});}
const catName=k=>k==='todos'?'Todo el rodeo':(CATS.find(c=>c[0]===k)||[k,k])[1];
const total=p=>CATS.reduce((s,c)=>s+(+((p.animales||{})[c[0]])||0),0);
const ug=p=>CATS.reduce((s,c)=>s+(+((p.animales||{})[c[0]])||0)*c[2],0);
function carga(p){const ha=+p.superficie||0;return ha>0?ug(p)/ha:null;}
function cargaCls(v){return v==null?'':v<=0.8?'ok':v<=1.1?'mid':'high';}
const potName=id=>{if(!id)return '';const p=state.potreros.find(x=>x.id===id);return p?p.nombre:'Potrero eliminado';};
const byName=(a,b)=>String(a.nombre).localeCompare(String(b.nombre),'es');
const byDateDesc=(a,b)=>String(b.fecha).localeCompare(String(a.fecha));

let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400);}

/* ---------- Almacenamiento: Firebase (Firestore + inicio de sesión con Google) ---------- */
const CONFIGURADO=!!(FB_CONFIG&&FB_CONFIG.apiKey&&!/PEGAR/i.test(FB_CONFIG.apiKey)&&FB_CONFIG.projectId&&!/PEGAR/i.test(FB_CONFIG.projectId));
let fs=null, auth=null, user=null, unsubs=[];
const pend={};
function setSync(kind,text){const s=$('#sync');s.hidden=false;s.className='sync '+kind;s.textContent=text;}
function updSync(){
  if(!user)return;
  const p=Object.values(pend).some(Boolean);
  if(!navigator.onLine)setSync('local',p?'Sin señal · se sube después':'Sin señal');
  else if(p)setSync('local','Subiendo…');
  else setSync('nube','Guardado');
}
addEventListener('online',updSync);addEventListener('offline',updSync);
function startData(){
  unsubs.forEach(u=>u());unsubs=[];
  COLS.forEach(c=>{
    unsubs.push(onSnapshot(collection(fs,'users',user.uid,c),{includeMetadataChanges:true},snap=>{
      state[c]=snap.docs.map(d=>({...d.data(),id:d.id}));pend[c]=snap.metadata.hasPendingWrites;updSync();render();
    },err=>{setSync('error','Error: '+(err.code||'sin acceso'));}));
  });
}
function errMsg(e){const c=e&&e.code||'';return c.includes('permission')?'No tenés permiso. Revisá las reglas de Firestore':c.includes('quota')||c.includes('resource-exhausted')?'Se pasó el límite diario gratis. Mañana vuelve a funcionar':'No se pudo guardar ('+(c||'error')+')';}
// Con Firestore el cambio se ve al instante y se sube cuando hay señal: no hace falta esperar
async function save(col,id,data){
  if(!user){toast('Iniciá sesión primero');return false;}
  const {id:_x,...body}=data;
  setDoc(doc(fs,'users',user.uid,col,id),body).catch(e=>toast(errMsg(e)));
  return true;
}
async function remove(col,id,quiet){
  if(!user)return false;
  deleteDoc(doc(fs,'users',user.uid,col,id)).catch(e=>toast(errMsg(e)));
  if(!quiet)toast('Eliminado');return true;
}
// Guarda el potrero y deja una foto con fecha en el historial (una por potrero y por día; vale la última del día)
async function savePotrero(id,data,motivo){
  if(!await save('potreros',id,data))return false;
  const f=data.actualizado||todayStr();
  await save('historial',id+'_'+f,{potreroId:id,fecha:f,nombre:data.nombre,superficie:+data.superficie||0,animales:{...(data.animales||{})},pasto:data.pasto||'',agua:data.agua||'',motivo:motivo||''});
  return true;
}
async function removePotrero(id){
  await remove('potreros',id,true);
  for(const h of state.historial.filter(x=>x.potreroId===id))await remove('historial',h.id,true);
  toast('Potrero eliminado');
}

function bajar(nombre,texto,tipo){
  try{const b=new Blob([texto],{type:tipo});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nombre;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}
  catch(e){toast('No se pudo descargar el archivo');}
}
const csvCell=v=>{v=v==null?'':String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
const dec=n=>String(n??'').replace('.',',');
function csv(rows){return '﻿'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n');}
const PLANILLAS={
  potreros:()=>csv([['Potrero','Hectáreas',...CATS.map(c=>c[1]),'Total','UG/ha','Pasto','Aguada','Actualizado','Notas'],...[...state.potreros].sort(byName).map(p=>{const c=carga(p);return [p.nombre,dec(p.superficie),...CATS.map(k=>(p.animales||{})[k[0]]||0),total(p),c==null?'':dec(c.toFixed(2)),p.pasto,p.agua,p.actualizado,p.notas];})]),
  sanidad:()=>csv([['Fecha','Tipo','Producto','Dosis','A quién','Cantidad','Potrero','Próxima dosis','Notas'],...[...state.sanidad].sort(byDateDesc).map(s=>[s.fecha,s.tipo,s.producto,s.dosis,catName(s.categoria),s.cantidad||'',potName(s.potreroId),s.proxima,s.notas])]),
  lluvias:()=>csv([['Fecha','mm','Notas'],...[...state.lluvias].sort(byDateDesc).map(l=>[l.fecha,dec(l.mm),l.notas])]),
  historial:()=>csv([['Fecha','Potrero','Hectáreas',...CATS.map(c=>c[1]),'Total','Pasto','Motivo'],...[...state.historial].sort(byDateDesc).map(h=>[h.fecha,h.nombre,dec(h.superficie),...CATS.map(k=>(h.animales||{})[k[0]]||0),total(h),h.pasto,h.motivo])])
};
async function restaurar(file){
  let data;
  try{data=JSON.parse(await file.text());}catch(e){toast('Ese archivo no es una copia de la libreta');return;}
  const src=data&&data.datos?data.datos:data;
  if(!src||!COLS.some(c=>Array.isArray(src[c]))){toast('Ese archivo no es una copia de la libreta');return;}
  let n=0;
  for(const c of COLS){
    const arr=Array.isArray(src[c])?src[c]:[];
    for(let i=0;i<arr.length;i+=400){
      const b=writeBatch(fs);
      arr.slice(i,i+400).forEach(x=>{if(!x||!x.id)return;const {id,...body}=x;b.set(doc(fs,'users',user.uid,c,String(id)),body);n++;});
      b.commit().catch(e=>toast(errMsg(e)));
    }
  }
  toast(n+' registros restaurados');closeSheet();
}

function showGate(html){$('#gate').hidden=false;$('#gateBox').innerHTML=html;['app','tabs','fab','acctBtn','sync'].forEach(i=>$('#'+i).hidden=true);}
function showApp(){$('#gate').hidden=true;['app','tabs','fab','acctBtn'].forEach(i=>$('#'+i).hidden=false);}
function showLogin(err){
  showGate(`<h2>Libreta de Campo</h2><p>Potreros, sanidad, movimientos y lluvias. Entrá con tu cuenta de Google para ver tus datos en el celular y en la computadora.</p><button class="btn primary" type="button" data-act="login">Entrar con Google</button>${err?`<p class="err">${esc(err)}</p>`:''}`);
}
function loginErr(e){
  const c=e&&e.code||'';
  if(c==='auth/unauthorized-domain')return 'Esta dirección no está autorizada en Firebase. Agregala en Authentication → Configuración → Dominios autorizados: '+location.hostname;
  if(c==='auth/operation-not-allowed')return 'Falta activar el inicio con Google en Firebase (Authentication → Método de acceso).';
  if(c==='auth/network-request-failed')return 'Sin conexión. La primera vez necesitás internet para entrar.';
  if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return '';
  return 'No se pudo entrar ('+(c||'error')+').';
}
async function login(){
  const prov=new GoogleAuthProvider();
  try{await signInWithPopup(auth,prov);}
  catch(e){
    if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){try{await signInWithRedirect(auth,prov);}catch(e2){showLogin(loginErr(e2));}}
    else showLogin(loginErr(e));
  }
}

  h+=`<div class="stats">
    <div class="stat accent"><b class="num">${nf(tot)}</b><span>animales</span></div>
    <div class="stat"><b class="num">${nf(ha)}</b><span>hectáreas</span></div>
    <div class="stat"><b class="num">${cg==null?'–':nf(cg,2)}</b><span>UG/ha promedio</span></div>
  </div>`;
  h+=`<div><h2 class="sec">Para revisar</h2>${al.length?`<div class="rows">${al.slice(0,8).map(a=>`<div class="alert"><span class="dot ${a.cls}"></span><div class="body" style="min-width:0"><div>${a.t}</div><div class="card-sub">${a.s}</div></div></div>`).join('')}</div>`:`<div class="rows"><div class="alert"><span class="dot green"></span><div>Todo al día. No hay dosis próximas ni potreros sin contar.</div></div></div>`}</div>`;

function rainChart(){
  const now=new Date(), months=[];
  for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(d.getFullYear()+'-'+pad(d.getMonth()+1));}
  const vals=months.map(m=>state.lluvias.filter(l=>String(l.fecha).startsWith(m)).reduce((s,l)=>s+(+l.mm||0),0));
  const max=Math.max(...vals,1), W=360, H=150, top=18, base=126, bw=W/12;
  let bars='';
  vals.forEach((v,i)=>{const h=(v/max)*(base-top), x=i*bw+5, last=i===11;
    bars+=`<rect x="${x}" y="${base-h}" width="${bw-10}" height="${Math.max(h,v>0?2:0)}" rx="3" fill="var(--rain)" opacity="${last?1:.55}"/>`;
    if(v>0)bars+=`<text x="${x+(bw-10)/2}" y="${base-h-5}" text-anchor="middle" font-size="10" fill="var(--ink)" style="font-variant-numeric:tabular-nums">${Math.round(v)}</text>`;
    bars+=`<text x="${x+(bw-10)/2}" y="${base+16}" text-anchor="middle" font-size="10" fill="var(--muted)">${MESES[+months[i].slice(5)-1].slice(0,3)}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Milímetros por mes, últimos 12 meses"><line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--line)"/>${bars}</svg></div>`;
}

  h+=`<div><h2 class="sec">Últimos 12 meses (mm)</h2>${rainChart()}</div>`;

    h+=`<div style="margin-bottom:14px"><div class="month-head"><h3>${MESES[+mm-1]} ${yy}</h3><span class="num">${nf(sum,sum%1?1:0)} mm</span></div><div class="rows">`+g.map(l=>`
      <div class="row" style="align-items:center">
        <div class="date"><b class="num">${parseD(l.fecha).getDate()}</b><span>${MESES[parseD(l.fecha).getMonth()].slice(0,3)}</span></div>
        <div class="body"><strong class="num">${nf(l.mm,(+l.mm%1)?1:0)} mm</strong>${l.notas?`<span class="card-sub">${esc(l.notas)}</span>`:''}</div>
        <div class="tools"><button class="icon-btn" type="button" data-act="edit-lluvia" data-id="${esc(l.id)}">Editar</button><button class="icon-btn" type="button" data-act="del" data-col="lluvias" data-id="${esc(l.id)}">Borrar</button></div>
      </div>`).join('')+'</div></div>';
  });
  h+='</div>';
  $('#v-lluvias').innerHTML=h;
}

/* ---------- Hoja de carga ---------- */
function openSheet(title,html,onSubmit){
  $('#sheetTitle').textContent=title;$('#sheetForm').innerHTML=html;sheetSubmit=onSubmit;$('#sheet').hidden=false;
  document.body.style.overflow='hidden';
  const first=$('#sheetForm').querySelector('input,select');if(first&&!('ontouchstart' in window))first.focus();
}
function closeSheet(){$('#sheet').hidden=true;sheetSubmit=null;sheetRefresh=null;document.body.style.overflow='';}
const opts=(arr,sel)=>arr.map(v=>`<option ${v===sel?'selected':''}>${esc(v)}</option>`).join('');
const formBtns=lbl=>`<p class="err" id="formErr" hidden></p><div class="form-actions"><button type="button" class="btn" data-act="close">Cancelar</button><button type="submit" class="btn primary">${lbl}</button></div>`;
function formErr(msg){const e=$('#formErr');e.textContent=msg;e.hidden=false;}

function potreroForm(p){
  p=p||{animales:{}};
  openSheet(p.id?'Editar potrero':'Nuevo potrero',`
    <div class="field"><label for="f-nombre">Nombre</label><input id="f-nombre" name="nombre" required value="${esc(p.nombre)}" placeholder="Ej.: Potrero del Bajo"></div>
    <div class="grid2">
      <div class="field"><label for="f-sup">Superficie (ha)</label><input id="f-sup" name="superficie" type="number" inputmode="decimal" min="0" step="0.1" value="${esc(p.superficie)}"></div>
      <div class="field"><label for="f-pasto">Pasto</label><select id="f-pasto" name="pasto"><option value="">—</option>${opts(PASTO,p.pasto)}</select></div>
    </div>
    <div class="field"><label for="f-agua">Aguada</label><select id="f-agua" name="agua"><option value="">—</option>${opts(AGUA,p.agua)}</select></div>
    <div class="field"><span class="lbl">Animales</span><div class="catgrid">${CATS.map(c=>`<div class="field"><label for="f-c-${c[0]}" style="text-transform:none;letter-spacing:0;font-size:.85rem">${c[1]}</label><input id="f-c-${c[0]}" name="c_${c[0]}" type="number" inputmode="numeric" min="0" step="1" value="${+((p.animales||{})[c[0]])||''}" placeholder="0"></div>`).join('')}</div></div>
    <div class="field"><label for="f-notas">Notas</label><textarea id="f-notas" name="notas" placeholder="Estado del alambrado, sombra, lo que haga falta">${esc(p.notas)}</textarea></div>
    <p class="hint">Al guardar, la fecha de actualización queda en hoy.</p>
    ${formBtns(p.id?'Guardar cambios':'Agregar potrero')}`,
  async fd=>{
    const nombre=fd.get('nombre').trim();if(!nombre)return formErr('Poné un nombre al potrero.');
    const animales={};CATS.forEach(c=>{const v=parseInt(fd.get('c_'+c[0]),10);if(v>0)animales[c[0]]=v;});
    const data={nombre,superficie:parseFloat(fd.get('superficie'))||0,pasto:fd.get('pasto'),agua:fd.get('agua'),notas:fd.get('notas').trim(),animales,actualizado:todayStr()};
    if(await savePotrero(p.id||uid(),data,p.id?'Edición':'Alta')){closeSheet();toast(p.id?'Potrero actualizado':'Potrero agregado');}
  });
}

function sanForm(s){
  s=s||{fecha:todayStr(),categoria:'todos'};
  const pots=[...state.potreros].sort(byName);
  openSheet(s.id?'Editar tratamiento':'Nuevo tratamiento',`
    <div class="grid2">
      <div class="field"><label for="f-fecha">Fecha</label><input id="f-fecha" name="fecha" type="date" required value="${esc(s.fecha)}"></div>
      <div class="field"><label for="f-tipo">Tipo</label><select id="f-tipo" name="tipo">${opts(TIPOS,s.tipo)}</select></div>
    </div>
    <div class="field"><label for="f-prod">Producto</label><input id="f-prod" name="producto" required value="${esc(s.producto)}" placeholder="Ej.: Ivermectina 1%"></div>
    <div class="grid2">
      <div class="field"><label for="f-dosis">Dosis</label><input id="f-dosis" name="dosis" value="${esc(s.dosis)}" placeholder="Ej.: 1 ml / 50 kg"></div>
      <div class="field"><label for="f-cant">Cantidad de animales</label><input id="f-cant" name="cantidad" type="number" inputmode="numeric" min="0" value="${esc(s.cantidad)}"></div>
    </div>
    <div class="grid2">
      <div class="field"><label for="f-cat">A quién</label><select id="f-cat" name="categoria"><option value="todos">Todo el rodeo</option>${CATS.map(c=>`<option value="${c[0]}" ${c[0]===s.categoria?'selected':''}>${c[1]}</option>`).join('')}</select></div>
      <div class="field"><label for="f-pot">Potrero</label><select id="f-pot" name="potreroId"><option value="">Sin especificar</option>${pots.map(p=>`<option value="${esc(p.id)}" ${p.id===s.potreroId?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label for="f-prox">Próxima dosis (opcional)</label><input id="f-prox" name="proxima" type="date" value="${esc(s.proxima)}"></div>
    <div class="field"><label for="f-notas">Notas</label><textarea id="f-notas" name="notas" placeholder="Lote, veterinario, observaciones">${esc(s.notas)}</textarea></div>
    ${formBtns(s.id?'Guardar cambios':'Registrar')}`,
  async fd=>{
    const producto=fd.get('producto').trim(), fecha=fd.get('fecha');
    if(!fecha)return formErr('Elegí la fecha.');if(!producto)return formErr('Escribí qué producto se dio.');
    const data={fecha,tipo:fd.get('tipo'),producto,dosis:fd.get('dosis').trim(),cantidad:parseInt(fd.get('cantidad'),10)||0,categoria:fd.get('categoria'),potreroId:fd.get('potreroId'),proxima:fd.get('proxima')||'',notas:fd.get('notas').trim()};
    if(await save('sanidad',s.id||uid(),data)){closeSheet();toast(s.id?'Tratamiento actualizado':'Tratamiento registrado');}
  });
}

function lluviaForm(l){
  l=l||{fecha:todayStr()};
  openSheet(l.id?'Editar lluvia':'Anotar lluvia',`
    <div class="grid2">
      <div class="field"><label for="f-fecha">Fecha</label><input id="f-fecha" name="fecha" type="date" required value="${esc(l.fecha)}"></div>
      <div class="field"><label for="f-mm">Milímetros</label><input id="f-mm" name="mm" type="number" inputmode="decimal" min="0" step="0.5" required value="${esc(l.mm)}"></div>
    </div>
    <div class="field"><label for="f-notas">Notas</label><input id="f-notas" name="notas" value="${esc(l.notas)}" placeholder="Ej.: con granizo"></div>
    ${formBtns(l.id?'Guardar cambios':'Anotar')}`,
  async fd=>{
    const mm=parseFloat(fd.get('mm')), fecha=fd.get('fecha');
    if(!fecha)return formErr('Elegí la fecha.');if(!(mm>=0))return formErr('Escribí los milímetros.');
    if(await save('lluvias',l.id||uid(),{fecha,mm,notas:fd.get('notas').trim()})){closeSheet();toast('Lluvia anotada');}
  });
}

function moveForm(){
  const pots=[...state.potreros].sort(byName);
  const po=pots.map(p=>`<option value="${esc(p.id)}">${esc(p.nombre)} (${nf(total(p))})</option>`).join('');
  openSheet('Mover animales',`
    <div class="field"><label for="f-ori">Desde</label><select id="f-ori" name="origen">${po}</select></div>
    <div class="field"><label for="f-des">Hacia</label><select id="f-des" name="destino">${po}</select></div>
    <div class="grid2">
      <div class="field"><label for="f-cat">Categoría</label><select id="f-cat" name="categoria">${CATS.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</select></div>
      <div class="field"><label for="f-cant">Cantidad</label><input id="f-cant" name="cantidad" type="number" inputmode="numeric" min="1" required></div>
    </div>
    <p class="hint">Se descuentan del potrero de origen, se suman al de destino y queda anotado en el resumen.</p>
    ${formBtns('Mover')}`,
  async fd=>{
    const o=state.potreros.find(p=>p.id===fd.get('origen')), d=state.potreros.find(p=>p.id===fd.get('destino'));
    const cat=fd.get('categoria'), n=parseInt(fd.get('cantidad'),10);
    if(!o||!d||o.id===d.id)return formErr('Elegí dos potreros distintos.');
    if(!(n>0))return formErr('Escribí cuántos animales se mueven.');
    const hay=+((o.animales||{})[cat])||0;
    if(n>hay)return formErr(`${o.nombre} tiene ${hay} ${catName(cat).toLowerCase()}.`);
    const hoy=todayStr();
    const oa={...(o.animales||{})};oa[cat]=hay-n;if(!oa[cat])delete oa[cat];
    const da={...(d.animales||{})};da[cat]=(+da[cat]||0)+n;
    const {id:_o,...ob}=o, {id:_d,...db_}=d;
    if(!await savePotrero(o.id,{...ob,animales:oa,actualizado:hoy},'Salieron '+n+' '+catName(cat).toLowerCase()+' a '+d.nombre))return;
    if(!await savePotrero(d.id,{...db_,animales:da,actualizado:hoy},'Entraron '+n+' '+catName(cat).toLowerCase()+' de '+o.nombre))return;
    await save('movimientos',uid(),{fecha:hoy,origen:o.nombre,destino:d.nombre,categoria:cat,cantidad:n});
    closeSheet();toast('Movimiento registrado');
  });
  const des=$('#f-des');if(des.options.length>1)des.selectedIndex=1;
}

/* ---------- Historial ---------- */
const snapsOf=pid=>state.historial.filter(h=>h.potreroId===pid).sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));
function snapAt(pid,ym){const end=ym+'-31';let r=null;snapsOf(pid).forEach(h=>{if(String(h.fecha)<=end)r=h;});return r;}
const mesLargo=ym=>{const [y,m]=ym.split('-');return MESES[+m-1]+' de '+y;};
function catChips(an){const c=CATS.filter(k=>+((an||{})[k[0]])>0).map(k=>`<span class="chip num">${nf(an[k[0]])} ${k[1].toLowerCase()}</span>`).join('');return c||'<span class="chip">Sin animales</span>';}
function diffText(prev,cur){
  if(!prev)return '';
  const out=[];CATS.forEach(k=>{const d=(+((cur.animales||{})[k[0]])||0)-(+((prev.animales||{})[k[0]])||0);if(d)out.push((d>0?'+':'−')+Math.abs(d)+' '+k[1].toLowerCase());});
  if(prev.pasto!==cur.pasto&&cur.pasto)out.push('pasto '+cur.pasto.toLowerCase());
  return out.length?out.join(' · '):'Sin cambios en los números';
}
function snapBlock(h,extra){
  const t=total(h), c=h.superficie>0?ug(h)/h.superficie:null;
  return `<div class="card" style="gap:8px"><div class="card-head"><div style="min-width:0"><strong>${fullD(h.fecha)}</strong>${h.motivo?`<div class="card-sub">${esc(h.motivo)}</div>`:''}</div><div class="big"><b class="num" style="font-size:1.5rem">${nf(t)}</b><span>animales</span></div></div>
    <div class="chips">${catChips(h.animales)}${c!=null?`<span class="chip num ${cargaCls(c)}">${nf(c,2)} UG/ha</span>`:''}${h.pasto?`<span class="chip">Pasto ${esc(h.pasto.toLowerCase())}</span>`:''}</div>${extra||''}</div>`;
}
function histSheet(pid){
  openSheet('Historial','',null);
  sheetRefresh=()=>{
    const p=state.potreros.find(x=>x.id===pid);
    if(!p){$('#sheetForm').innerHTML='<p class="card-sub">Este potrero ya no existe.</p>';return;}
    $('#sheetTitle').textContent=p.nombre;
    const S=snapsOf(pid);
    let h=`<div class="field"><label for="histMes">Ver cómo estaba en</label><input id="histMes" type="month" value="${esc(ui.histMes)}" max="${todayStr().slice(0,7)}"></div>`;
    if(ui.histMes){
      const sn=snapAt(pid,ui.histMes);
      h+=sn?`<div><h2 class="sec">A fin de ${mesLargo(ui.histMes)}</h2>${snapBlock(sn,`<p class="hint">Dato del último registro antes de esa fecha (${fullD(sn.fecha)}).</p>`)}</div>`
          :`<div class="empty"><p>No hay datos de este potrero para ${mesLargo(ui.histMes)}.${S.length?' El primer registro es del '+fullD(S[0].fecha)+'.':''}</p></div>`;
    }
    h+=`<div><h2 class="sec">Todos los registros (${S.length})</h2>`;
    if(!S.length)h+=`<div class="empty"><p>Todavía no hay historial. Se guarda solo cada vez que editás, contás o movés animales de este potrero.</p><button class="btn primary" type="button" data-act="touch" data-id="${esc(pid)}">Guardar el estado de hoy</button></div>`;
    else h+='<div class="list">'+S.map((x,i)=>({x,i})).reverse().map(({x,i})=>snapBlock(x,i>0?`<p class="hint">${esc(diffText(S[i-1],x))}</p>`:'<p class="hint">Primer registro</p>')).join('')+'</div>';
    h+='</div><div class="form-actions"><button type="button" class="btn" data-act="close">Cerrar</button></div>';
    $('#sheetForm').innerHTML=h;
  };
  sheetRefresh();
}
function campoSheet(){
  if(!ui.campoMes)ui.campoMes=todayStr().slice(0,7);
  openSheet('El campo en otra fecha','',null);
  sheetRefresh=()=>{
    const ym=ui.campoMes;
    const ids=[...new Set(state.historial.map(h=>h.potreroId))];
    const rows=ids.map(id=>snapAt(id,ym)).filter(Boolean).sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre),'es'));
    const tot=rows.reduce((s,r)=>s+total(r),0), ha=rows.reduce((s,r)=>s+(+r.superficie||0),0);
    const cats=CATS.map(c=>[c[1],rows.reduce((s,r)=>s+(+((r.animales||{})[c[0]])||0),0)]).filter(c=>c[1]>0);
    let h=`<div class="field"><label for="campoMes">Mes</label><input id="campoMes" type="month" value="${esc(ym)}" max="${todayStr().slice(0,7)}"></div>`;
    if(!rows.length){h+=`<div class="empty"><p>No hay datos guardados para ${mesLargo(ym)}. El historial empieza desde que cargás o contás cada potrero.</p></div>`;}
    else{
      h+=`<div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat accent"><b class="num">${nf(tot)}</b><span>animales a fin de ${MESES[+ym.slice(5)-1]}</span></div><div class="stat"><b class="num">${nf(ha)}</b><span>hectáreas</span></div></div>`;
      if(cats.length)h+=`<div class="cats">${cats.map(c=>`<div><span>${c[0]}</span><b class="num">${nf(c[1])}</b></div>`).join('')}</div>`;
      h+='<div class="list">'+rows.map(r=>{const gone=!state.potreros.some(p=>p.id===r.potreroId);
        return `<div class="card" style="gap:8px"><div class="card-head"><div style="min-width:0"><h3 class="card-title" style="font-size:1.1rem">${esc(r.nombre)}</h3><div class="card-sub">Dato del ${fullD(r.fecha)}${gone?' · potrero eliminado':''}</div></div><div class="big"><b class="num" style="font-size:1.5rem">${nf(total(r))}</b><span>animales</span></div></div><div class="chips">${catChips(r.animales)}</div></div>`;}).join('')+'</div>';
    }
    h+='<div class="form-actions"><button type="button" class="btn" data-act="close">Cerrar</button></div>';
    $('#sheetForm').innerHTML=h;
  };
  sheetRefresh();
}

/* ---------- Navegación y eventos ---------- */
const FAB={inicio:['Potrero',()=>potreroForm()],potreros:['Potrero',()=>potreroForm()],sanidad:['Tratamiento',()=>sanForm()],lluvias:['Lluvia',()=>lluviaForm()]};
function go(v){
  if(!FAB[v])v='inicio';view=v;
  document.querySelectorAll('.view').forEach(s=>s.hidden=s.id!=='v-'+v);
  document.querySelectorAll('.tab').forEach(t=>{if(t.dataset.v===v)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current');});
  $('#fabLbl').textContent=FAB[v][0];
  try{history.replaceState(null,'','#'+v)}catch(e){}
  window.scrollTo(0,0);
}

const armed=new Map();
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act, id=b.dataset.id;
  if(a==='nav')go(b.dataset.v);
  else if(a==='fab')FAB[view][1]();
  else if(a==='close')closeSheet();
  else if(a==='new-potrero')potreroForm();
  else if(a==='new-san')sanForm();
  else if(a==='new-lluvia')lluviaForm();
  else if(a==='move'){if(state.potreros.length<2)toast('Necesitás al menos dos potreros');else moveForm();}
  else if(a==='edit-potrero')potreroForm(state.potreros.find(x=>x.id===id));
  else if(a==='edit-san')sanForm(state.sanidad.find(x=>x.id===id));
  else if(a==='edit-lluvia')lluviaForm(state.lluvias.find(x=>x.id===id));
  else if(a==='touch'){const p=state.potreros.find(x=>x.id===id);if(p){const {id:_i,...pb}=p;savePotrero(p.id,{...pb,actualizado:todayStr()},'Conteo').then(ok=>ok&&toast('Contado hoy, guardado en el historial'));}}
  else if(a==='hist'){ui.histMes='';histSheet(id);}
  else if(a==='campo'){campoSheet();}
  else if(a==='login')login();
  else if(a==='account')cuentaSheet();
  else if(a==='bk-down'){bajar('libreta-campo-'+todayStr()+'.json',JSON.stringify({app:'libreta-campo',version:1,exportado:new Date().toISOString(),datos:state},null,1),'application/json');toast('Copia descargada');}
  else if(a==='csv'){bajar(b.dataset.k+'-'+todayStr()+'.csv',PLANILLAS[b.dataset.k](),'text/csv;charset=utf-8');}
  else if(a==='logout'){if(b.classList.contains('armed')){closeSheet();signOut(auth);}else{b.textContent='¿Seguro? Tocá de nuevo';b.classList.add('armed');}}
  else if(a==='del'){
    const key=b.dataset.col+'/'+id;
    if(armed.has(key)){clearTimeout(armed.get(key));armed.delete(key);if(b.dataset.col==='potreros')removePotrero(id);else remove(b.dataset.col,id);}
    else{const old=b.textContent;b.textContent='¿Seguro?';b.classList.add('armed');
      armed.set(key,setTimeout(()=>{armed.delete(key);b.textContent=old;b.classList.remove('armed');},3500));}
  }
});
$('#sheetForm').addEventListener('submit',e=>{e.preventDefault();if(sheetSubmit)sheetSubmit(new FormData(e.target));});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();});
document.addEventListener('change',e=>{if(e.target.id==='bkFile'&&e.target.files[0]){restaurar(e.target.files[0]);return;}
  if(e.target.id==='sanYear'){ui.sanYear=e.target.value;renderSanidad();}
  else if(e.target.id==='histMes'){ui.histMes=e.target.value;sheetRefresh&&sheetRefresh();}
  else if(e.target.id==='campoMes'){ui.campoMes=e.target.value;sheetRefresh&&sheetRefresh();}});
let qT;document.addEventListener('input',e=>{if(e.target.id==='sanQ'){ui.sanQ=e.target.value;clearTimeout(qT);qT=setTimeout(()=>{renderSanidad();const i=$('#sanQ');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},250);}});

/* ---------- Inicio ---------- */
(function(){const d=new Date();$('#hoy').textContent=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'][d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()];})();
go((location.hash||'').slice(1)||'inicio');
render();
if(!CONFIGURADO){
  showGate(`<h2>Falta un paso</h2><p>La página todavía no está conectada a tu base de datos. Abrí el archivo <b>firebase-config.js</b> y pegá los datos de tu proyecto de Firebase (paso 4 de las instrucciones).</p>`);
}else{
  const app=initializeApp(FB_CONFIG);
  auth=getAuth(app);
  fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
  getRedirectResult(auth).catch(e=>showLogin(loginErr(e)));
  onAuthStateChanged(auth,u=>{
    user=u;
    if(u){showApp();startData();updSync();}
    else{unsubs.forEach(f=>f());unsubs=[];COLS.forEach(c=>state[c]=[]);render();showLogin();}
  });
}
</script>
